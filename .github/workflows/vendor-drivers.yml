name: Server and driver versions

# The driver's integration tests with other versions of each engine's JDBC driver than the one CI
# uses (gradle/libs.versions.toml), and with other versions of each database server than the image
# CI starts (testing/Engines.java), for the ranges the README states (todo 327). The application
# supplies the vendor driver and the server, so the ranges are what users can rely on. Weekly rather
# than per pull request, as the isolation tests are: one job per engine and version, each the length
# of that engine's CI job. ScalarDB's own use of the driver in the tests takes the same version.
on:
  schedule:
    - cron: "0 20 * * 6" # Sunday 05:00 JST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  driver-version:
    name: ${{ matrix.engine }} ${{ matrix.image }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # the runners the repository gets are few, and CI needs some
      max-parallel: 6
      matrix:
        include:
          # The newest patch of every line in the range the README states, and ojdbc11 23.4 to 23.8,
          # not yet in it; CI runs the current ones. Out of the range: MariaDB Connector/J 3.0 and 3.1
          # (many failures), 3.2.0 (getGeneratedKeys after a batch throws) and 3.4 (one write
          # conflict test), and ojdbc11 23.2 (Oracle's cursor and parse counts). pgjdbc before 42.7
          # fails Connection.abort() on Java 24 or later with a SecurityException, as it does without
          # the driver: the one test that calls it is left out for those versions.
          - { engine: Postgresql, property: postgresql, version: 42.6.2, exclude: '*InterleavingIntegrationTest' }
          - { engine: Postgresql, property: postgresql, version: 42.5.6, exclude: '*InterleavingIntegrationTest' }
          - { engine: Postgresql, property: postgresql, version: 42.4.5, exclude: '*InterleavingIntegrationTest' }
          - { engine: Postgresql, property: postgresql, version: 42.3.10, exclude: '*InterleavingIntegrationTest' }
          - { engine: Postgresql, property: postgresql, version: 42.2.29, exclude: '*InterleavingIntegrationTest' }
          - { engine: Mysql, property: mysql, version: 26.10.0 }
          - { engine: Mysql, property: mysql, version: 9.7.0 }
          - { engine: Mysql, property: mysql, version: 8.4.0 }
          - { engine: Mysql, property: mysql, version: 8.0.33 }
          - { engine: Mariadb, property: mariadb, version: 4.0.0 }
          - { engine: Mariadb, property: mariadb, version: 3.5.11 }
          - { engine: Mariadb, property: mariadb, version: 3.3.7 }
          - { engine: Sqlserver, property: sqlserver, version: 13.6.1.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 13.4.0.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 13.2.1.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 12.10.2.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 12.8.2.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 12.6.5.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 12.4.3.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 12.2.1.jre11 }
          - { engine: Sqlserver, property: sqlserver, version: 11.2.3.jre11 }
          - { engine: Oracle, property: oracle, version: 23.26.0.0.0 }
          - { engine: Oracle, property: oracle, version: 23.9.0.25.07 }
          - { engine: Oracle, property: oracle, version: 23.8.0.25.04 }
          - { engine: Oracle, property: oracle, version: 23.7.0.25.01 }
          - { engine: Oracle, property: oracle, version: 23.6.0.24.10 }
          - { engine: Oracle, property: oracle, version: 23.5.0.24.07 }
          - { engine: Oracle, property: oracle, version: 23.4.0.24.05 }
          - { engine: Oracle, property: oracle, version: 21.23.0.0 }
          - { engine: Oracle, property: oracle, version: 21.1.0.0 }
          # Every server major its vendor supports, with CI's driver: CI runs PostgreSQL 16, MySQL
          # 8.4, MariaDB 11.4, SQL Server 2022 and Oracle Free 23. Left out at their end of life:
          # PostgreSQL 14 (November 2026), MySQL 8.0 and MariaDB 10.6; Oracle 21c, an innovation
          # release. Oracle 19c, the other long-term release, is not supported yet: its
          # SQL%BULK_ROWCOUNT counts a row IGNORE_ROW_ON_DUPKEY_INDEX skips, which the bulk INSERT
          # relies on, and it has no multi-row VALUES (todo 327).
          - { engine: Postgresql, property: postgresql, image: 'postgres:15' }
          - { engine: Postgresql, property: postgresql, image: 'postgres:17' }
          - { engine: Postgresql, property: postgresql, image: 'postgres:18' }
          - { engine: Mysql, property: mysql, image: 'mysql:9.7' }
          - { engine: Mysql, property: mysql, image: 'mysql:26.10' }
          - { engine: Mariadb, property: mariadb, image: 'mariadb:10.11' }
          - { engine: Mariadb, property: mariadb, image: 'mariadb:11.8' }
          - { engine: Mariadb, property: mariadb, image: 'mariadb:12.3' }
          - { engine: Mariadb, property: mariadb, image: 'mariadb:13.0' }
          - { engine: Sqlserver, property: sqlserver, image: 'mcr.microsoft.com/mssql/server:2017-latest' }
          - { engine: Sqlserver, property: sqlserver, image: 'mcr.microsoft.com/mssql/server:2019-latest' }
          - { engine: Sqlserver, property: sqlserver, image: 'mcr.microsoft.com/mssql/server:2025-latest' }
          # The corners: the oldest driver in the range against the oldest server
          - { engine: Postgresql, property: postgresql, image: 'postgres:15', version: 42.2.29, exclude: '*InterleavingIntegrationTest' }
          - { engine: Mariadb, property: mariadb, image: 'mariadb:10.11', version: 3.3.7 }
          - { engine: Sqlserver, property: sqlserver, image: 'mcr.microsoft.com/mssql/server:2017-latest', version: 11.2.3.jre11 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Integration tests
        env:
          EXCLUDE: ${{ matrix.exclude }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ matrix.version }}
        run: >-
          ./gradlew :driver:integrationTest${{ matrix.engine }}
          ${VERSION:+"-Pnativejdbc.${{ matrix.property }}.driverVersion=$VERSION"}
          ${IMAGE:+"-Dnativejdbc.${{ matrix.property }}.image=$IMAGE"}
          ${EXCLUDE:+"-Pnativejdbc.excludeTests=$EXCLUDE"}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ strategy.job-index }}-${{ matrix.engine }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
