name: CI

# Version branches are covered as well as main: a release is cut from a version branch, and the commit
# that sets the release version plus every backport after it exist only there.
on:
  push:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # `check` includes the integration tests, which run database containers through Testcontainers
      # on the runner's Docker.
      - name: Check
        run: ./gradlew check

      # Every Java source set, not just main + test: `check` compiles the integration tests too, but
      # with the build cache on, a cached compile task replays no javac output, so Error Prone and
      # NullAway warnings would go unseen.
      - name: Check compiler warnings
        run: ./gradlew clean compileTestJava compileIntegrationTestJava --no-build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
