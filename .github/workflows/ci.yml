name: CI

# Version branches are covered as well as main: a release is cut from a version branch, and the commit
# that sets the release version plus every backport after it exist only there.
on:
  push:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
  pull_request:
  # release.yml runs it on the tagged commit before anything is signed: a tag can be pushed before,
  # or regardless of, the branch's own run. Called, github.workflow is the caller's name, so the group
  # below is "Release-<tag>", which release.yml's own group must not equal.
  workflow_call:

# A newer push cancels a pull request's run, but never a run on main or a version branch: Oracle's
# job takes about 20 minutes, and a push inside that window left the commit before it without a
# result. Runs on a branch queue instead; while one runs, GitHub keeps only the newest waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # bounded, since release.yml calls this workflow and holds its never-cancelled group meanwhile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The integration tests run in the matrix job below, one engine per runner.
      - name: Check
        run: ./gradlew check -Dnativejdbc.engines=none

      # Every Java source set, not just main + test: `check` compiles the integration tests too, but
      # with the build cache on, a cached compile task replays no javac output, so Error Prone and
      # NullAway warnings would go unseen.
      - name: Check compiler warnings
        run: ./gradlew clean compileTestJava compileIntegrationTestJava --no-build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # One runner per engine configuration: each runs the per-engine integration test tasks of every
  # module, its database in a container on the runner's Docker.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [Postgresql, Oracle, Mysql, MysqlLowerCase, Mariadb, Sqlserver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Integration tests
        run: ./gradlew integrationTest${{ matrix.engine }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.engine }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
