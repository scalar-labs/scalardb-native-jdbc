name: CI

# Version branches are covered as well as main: a release is cut from a version branch, and the commit
# that sets the release version plus every backport after it exist only there.
on:
  push:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
  pull_request:
  # release.yml runs it on the tagged commit before anything is signed: a tag can be pushed before,
  # or regardless of, the branch's own run. Called, github.workflow is the caller's name, so the group
  # below is "Release-<tag>", which release.yml's own group must not equal.
  workflow_call:

# A newer push cancels a pull request's run, but never a run on main or a version branch: Oracle's
# job takes about 20 minutes, and a push inside that window left the commit before it without a
# result. Runs on a branch queue instead; while one runs, GitHub keeps only the newest waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # bounded, since release.yml calls this workflow and holds its never-cancelled group meanwhile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The integration tests run in the matrix job below, one engine per runner.
      - name: Check
        run: ./gradlew check -Dnativejdbc.engines=none

      # Every Java source set, not just main + test: `check` compiles the integration tests too, but
      # with the build cache on, a cached compile task replays no javac output, so Error Prone and
      # NullAway warnings would go unseen.
      - name: Check compiler warnings
        run: ./gradlew clean compileTestJava compileIntegrationTestJava --no-build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # One runner per engine configuration: each runs the per-engine integration test tasks of every
  # module, its database in a container on the runner's Docker.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [Postgresql, Oracle, Mysql, MysqlLowerCase, Mariadb, Sqlserver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Integration tests
        run: ./gradlew integrationTest${{ matrix.engine }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.engine }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Oracle 19c, the long-term release before 23ai: the organization's private image, SE2 19.3.0 with
  # its database created, reached as an existing database (testing/Engines.java). A pull request from
  # a fork or from Dependabot has no CR_PAT to pull it with, so the job runs only for the others.
  integration-test-oracle-19c:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      # the container is up in about 3 minutes, but one start never got there in 23: a second
      # start after 12 minutes, the log of each shown
      - name: Start Oracle 19c
        run: |
          ready() {
            for _ in $(seq 72); do
              if docker exec oracle19 /opt/oracle/checkDBStatus.sh > /dev/null 2>&1; then return 0; fi
              sleep 10
            done
            return 1
          }
          docker pull -q ghcr.io/scalar-labs/oracle/db-prebuilt:19
          started=false
          for attempt in 1 2; do
            docker run -d --name oracle19 -p 1521:1521 ghcr.io/scalar-labs/oracle/db-prebuilt:19
            if ready; then started=true; break; fi
            echo "::warning::Oracle 19c not ready after 12 minutes (attempt $attempt)"
            docker logs --tail 100 oracle19
            docker rm -f oracle19
          done
          "$started"
          echo 'SELECT banner_full FROM v$version;' \
            | docker exec -i oracle19 bash -c 'sqlplus -s / as sysdba'

      - name: Integration tests
        run: >-
          ./gradlew :driver:integrationTestOracle
          -Dnativejdbc.oracle.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
          -Dnativejdbc.oracle.username=system
          -Dnativejdbc.oracle.password=Oracle

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-oracle-19c
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
