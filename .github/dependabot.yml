version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.github.spotbugs*"
          - "com.google.errorprone*"
          - "com.h3xstream.findsecbugs*"
          - "com.uber.nullaway*"
          - "com.vanniktech*"
          - "net.ltgt.gradle*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # The release branches' workflow updates, one entry per maintained line (RELEASING.md, "Cutting a
  # branch"); Dependabot reads this file from the default branch only
  - package-ecosystem: github-actions
    directory: /
    target-branch: "3.20"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
