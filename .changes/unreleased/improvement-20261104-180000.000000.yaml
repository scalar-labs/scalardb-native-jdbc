kind: improvement
body: 'On Oracle, a read the driver runs as written behind its in-flight checks now carries them on a row of its own, so that an empty result is one statement: in autocommit at SNAPSHOT such a read had run a second time, twice the work for TPC-H Q18, and at READ COMMITTED it had fallen back to the rewritten form. A bare `*` and a grouped read now take the form too.'
