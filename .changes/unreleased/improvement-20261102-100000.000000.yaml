kind: improvement
body: 'On Oracle, a READ COMMITTED read of a decoupled table inside a transaction whose WHERE and ON clauses name only the table''s key columns now reads each row''s committed image from one derived table over the metadata join, with no second branch for the rows in flight and no read of the in-flight index. A key lookup reads the data row and its metadata row by their primary keys alone.'
