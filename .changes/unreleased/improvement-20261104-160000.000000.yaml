kind: improvement
body: 'At READ COMMITTED on PostgreSQL and Oracle, a read with a subquery on a ScalarDB table, such as TPC-H Q18 and Q20, now runs as written over the data tables when none of its tables has a row in flight; it had read the subquery''s table through the committed-rows view in every copy of the rewrite, 33 to 118 times the vendor''s time. Such a statement no longer records the rows it read for the checks of later writes in the transaction.'
