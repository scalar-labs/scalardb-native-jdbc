kind: enhancement
body: PostgreSQL, MySQL, MariaDB and SQL Server are supported at READ COMMITTED, SNAPSHOT and SERIALIZABLE, and Oracle at READ COMMITTED and SNAPSHOT, against the ScalarDB 3.20 line. A connection starts at SNAPSHOT, ScalarDB's default. Both of ScalarDB's layouts are served, inline and decoupled transaction metadata, and an application names a table the same way in either. See `docs/transactions.md` and `docs/sql-support.md`.
