kind: enhancement
body: 'The first release of ScalarDB Native JDBC on Maven Central, after the 3.19.0-alpha.1 preview. It is a JDBC driver for a database that holds both ordinary tables and ScalarDB tables. The application uses the database''s own SQL and transactions on both: a transaction through the driver is one native transaction, ACID across both kinds of table, and ScalarDB''s transactions on the same tables keep their guarantees. The driver wraps the database''s own JDBC driver, which the application supplies, and connects with `jdbc:scalardb-native:<database>:...` URLs. It is published to Maven Central as `com.scalar-labs:scalardb-native-jdbc` and runs on Java 11 or later. See `docs/getting-started.md`.'
