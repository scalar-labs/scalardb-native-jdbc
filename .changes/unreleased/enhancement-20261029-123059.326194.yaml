kind: enhancement
body: '`scalardb-native-tools`, shipped as `scalardb-native-tools-<version>.zip` on the GitHub release, runs the one-time setup the driver needs on ScalarDB tables, checks it, undoes it, and adds a table to it while applications run. See `docs/setting-up-tables.md`.'
