[versions]
# The ScalarDB line the driver is certified against, at its newest patch. The driver has no runtime
# dependency on ScalarDB; this is the version its tests run real transactions with
# (docs/design.md, "Version and compatibility"). 3.20.0 is tested on 3.19.1: ScalarDB 3.20.0
# removed the two-phase commit API the tests hold rows prepared with (RELEASING.md, "Certifying a
# line").
scalardb = "3.19.1"
jsqlparser = "5.4"
# Kept at ScalarDB's version, since the driver is loaded next to ScalarDB in the tests
slf4j = "1.7.36"
logback = "1.5.38"
hikaricp = "4.0.3"
picocli = "4.7.7"
# The Spring Data JDBC sample (docs/plans/proxy-step.md, 9c), on the Spring Framework line it needs
spring-data-jdbc = "4.1.1"
# The shell's line editor; JLine 4 is compiled for Java 11
jline = "4.4.7"
# Vendor JDBC drivers: the application supplies its own; these are the versions the tests run
postgresql = "42.7.14"
mysql = "26.7.0"
mariadb = "3.5.10"
mssql = "13.6.0.jre11"
oracle = "23.26.3.0.0"
testcontainers = "2.0.5"
junit-jupiter = "5.14.4"
mockito = "5.24.0"
assertj = "3.27.7"
# Build tools, at ScalarDB Saga's versions
spotless = "8.9.0"
google-java-format = "1.35.0"
spotbugs-plugin = "6.5.10"
spotbugs-annotations = "4.10.3"
findsecbugs = "1.14.0"
errorprone = "2.50.0"
errorprone-plugin = "5.1.0"
nullaway = "0.13.8"
nullaway-plugin = "3.1.0"
jspecify = "1.0.1"
jcip = "1.0-1"
maven-publish-plugin = "0.37.0"

[libraries]
# Consumed only as a version (spotless's googleJavaFormat(...) takes a version string); the library
# entry exists so Dependabot can map the version to a module and bump it, like junit-jupiter below.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
scalardb = { module = "com.scalar-labs:scalardb", version.ref = "scalardb" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
spring-data-jdbc = { module = "org.springframework.data:spring-data-jdbc", version.ref = "spring-data-jdbc" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
jline-terminal = { module = "org.jline:jline-terminal", version.ref = "jline" }
jline-terminal-jni = { module = "org.jline:jline-terminal-jni", version.ref = "jline" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }
testcontainers-mssqlserver = { module = "org.testcontainers:testcontainers-mssqlserver" }
testcontainers-oracle-free = { module = "org.testcontainers:testcontainers-oracle-free" }
# The test suites take the version string rather than the module (see useJUnitJupiter in
# scalardb-native-jdbc.java-conventions), so nothing resolves this entry; it exists so Dependabot can
# bump the version.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jcip-annotations = { module = "com.github.stephenc.jcip:jcip-annotations", version.ref = "jcip" }

# Gradle plugins the convention plugins apply: libraries on build-logic's classpath
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
nullaway-gradle-plugin = { module = "net.ltgt.gradle:gradle-nullaway-plugin", version.ref = "nullaway-plugin" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish-plugin" }
